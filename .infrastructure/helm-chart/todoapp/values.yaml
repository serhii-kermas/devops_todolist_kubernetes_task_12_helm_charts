common:
  name: todoapp

todoapp:
  rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  containers:
      name: todoapp
      image: ikulyk404/todoapp
      version: 4.0.1
  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"
  secrets:
    SECRET_KEY: QGUyKHl4KXYmdGdoM19zPTB5amEtaSFkcGVieHN6XmRnNDd4KS1rJmtxXzN6Zio5ZSoK
    DB_NAME: "YXBwX2RiCg=="
    DB_USER: "YXBwX3VzZXI="
    DB_PASSWORD: "MTIzNA=="
    DB_HOST: "bXlzcWwtMC5teXNxbC5teXNxbC5zdmMuY2x1c3Rlci5sb2NhbAo="
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: app
          operator: In
          values:
          - kube2py
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpu:
      targetAverageUtilization: 70
    memory:
      targetAverageUtilization: 70
  pv:
    storage: 1Gi
  pvc:
    storage: 1Gi
  rbac:
    srviceAccountName: secrets-reader
    